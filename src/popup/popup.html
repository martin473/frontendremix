<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frontend Remix</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header class="frx-header">
<div class="frx-brand">
<span class="frx-logo" aria-hidden="true">FR</span>
<div>
<h1 id="frx-title" class="frx-title">Frontend Remix</h1>
<p id="frx-page-title" class="frx-page-title frx-sub">Loading…</p>
</div>
</div>
<button id="frx-refresh-icon" class="frx-icon-btn" type="button" title="Rescan fonts" aria-label="Rescan fonts">↻</button>
</header>

<section class="frx-style-bar">
<label for="frx-style-picker">Style</label>
<select id="frx-style-picker" aria-label="Choose a design style">
<option value="">None</option>
</select>
<button id="frx-style-clear" class="frx-btn frx-btn--style" type="button">Clear</button>
<p id="frx-style-status" class="frx-style-status" role="status"></p>
</section>

<main class="frx-main">
<div class="frx-toolbar">
<button id="frx-refresh" class="frx-btn" type="button">Refresh</button>
<button id="frx-reset" class="frx-btn frx-btn--danger" type="button">Reset all</button>
</div>
<p id="frx-status" class="frx-status" role="status"></p>
<p id="frx-loading" class="frx-loading" hidden>Scanning page…</p>
<p id="frx-empty" class="frx-empty" hidden>No fonts detected on this page.</p>
<ul id="frx-list" class="frx-list"></ul>
</main>

<script src="popup.js"></script>
</body>
</html>
